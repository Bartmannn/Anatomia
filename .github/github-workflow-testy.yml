# Automatyczne testy przy każdej zmianie i propozycji zmian (pull request).
# Wynik widać w zakładce „Actions” oraz przy propozycji zmian (zielony ✓ albo czerwony ✗).
name: Testy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sprawdzenie treści i danych
        run: node tools/check_content.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Przeglądarka do testu
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Test strony w przeglądarce
        run: python tools/smoke_test.py
