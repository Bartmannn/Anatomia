server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bez cache: po zmianie content.js czy landmarks-fix.js wystarczy odświeżyć stronę.
    add_header Cache-Control "no-store" always;

    # Model 3D (glTF binarny) — nginx domyślnie nie zna tego typu.
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-store" always;
    }
}
